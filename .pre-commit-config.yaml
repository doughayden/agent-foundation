repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # TODO: drop -shellcheck= once the run-script findings are fixed (#255)
      - id: actionlint
        args: [-shellcheck=]
  - repo: local
    hooks:
      # Your own uv, held inside [tool.uv] required-version; CI runs the pinned setup-uv version
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(uv\.(lock|toml)|pyproject\.toml)$
        pass_filenames: false
      # check --fix can change layout, so the formatter runs after it
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt
        language: system
        types: [terraform]
