[project]
name = "agent-foundation"
version = "0.19.1"
description = "Opinionated, production-ready LLM Agent deployment with enterprise-grade infrastructure"
readme = "README.md"
authors = [
    { name = "doug", email = "110487462+doughayden@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Pin ADK to test releases before locking upgrades
    "google-adk[gcp,otel-gcp]==2.14.0",
    "google-auth>=2.40.3,<3.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2.0.0",
    "opentelemetry-instrumentation-logging>=0.66b2,<0.67",
    "opentelemetry-resourcedetector-gcp>=1.14.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "sqlalchemy[postgresql-asyncpg]>=2.0.45,<3.0.0",
]

[project.scripts]
server = "agent_foundation.server:main"

[dependency-groups]
dev = [
    "codespell>=2.4.3,<3.0.0",
    "google-adk[eval]==2.14.0",
    "httpx>=0.28.1,<1.0.0",
    "ipykernel>=7.0.0,<8.0.0",
    "mypy>=2.4.1,<3.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "ruff>=0.12.7,<1.0.0",
    "testcontainers[postgres]>=4.15.0,<5.0.0",
    "types-grpcio>=1.0.0.20251009,<2.0.0.0",
    "types-pyyaml>=6.0.12.20260906,<7.0.0.0",
]
docs = [
    "mkdocs-callouts>=1.16.0,<2.0.0",
    "mkdocs-material>=9.7.1,<10.0.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
exclude-newer = "4 days"
# https://docs.astral.sh/uv/reference/settings/#required-version
# Developer range; the exact pins (Dockerfile, setup-uv) must fall inside it
required-version = ">=0.13,<0.14"

[tool.codespell]
skip = "uv.lock"
# ROUGE is the eval metric (ADK response_match_score), not a misspelling of rogue
ignore-words-list = "rouge"

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert statements in tests

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
# Tests are namespace packages (no __init__.py), so module names come from paths
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Test functions take fixtures by name without annotations
module = "tests.*"
disable_error_code = ["arg-type", "no-untyped-def", "no-untyped-call"]

[[tool.mypy.overrides]]
# Fixture definitions stay fully typed
module = "tests.*.conftest"
enable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # server.py: wiring run at import (settings, telemetry, ADK app); smoke lane
    "src/**/server.py",
    # agent.py: App and LlmAgent composition; eval lane
    "src/**/agent.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 100

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
# https://docs.pytest.org/en/stable/explanation/goodpractices.html
# --strict-markers: an unregistered marker is an error, not a warning. The eval lane's
# markers are a CI contract (judge-eval.yml selects on them), so a typo must fail
# collection rather than silently route a test into the wrong workflow step.
addopts = "--import-mode=importlib --strict-markers"
# Bare `pytest` runs only the fast, deterministic unit lane; other lanes run by
# explicit path (e.g. `uv run pytest tests/integration`) — see AGENTS.md Testing Patterns
testpaths = ["tests/unit"]
# Registered markers (pytest-native categorization) enable `-m` selection like
# `-m "not integration"`; lanes themselves still run by explicit path above
markers = [
    "integration: requires a real external resource (e.g. Postgres); no LLM or cloud",
    "smoke: requires a live deployed service URL",
    "deterministic: eval case scored by exact/ROUGE match (the PR gate)",
    "judge: eval case scored by an LLM judge (non-deterministic; adds the Gen AI eval service)",
    "liveness: eval preflight probing a model endpoint; never a behavioral result",
]
asyncio_mode = "auto"
# Enable live logs on demand: `uv run pytest --log-cli-level=DEBUG`
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
