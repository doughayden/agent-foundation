version: 2
# Cooldown is exclude-newer plus one day: Dependabot counts whole days, so the same number can admit a release up to a day younger
updates:
  # Bumps SHA pins and their version comments; setup-uv's uv input stays put, held to [tool.uv] required-version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  # Minor and patch updates share one pull request; each major update gets its own.
  # increase raises each lower bound to the new version, so the floor matches what CI tested
  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  # terraform/main: CI plans each bump on the pull request and applies it to dev on merge
  - package-ecosystem: terraform
    directory: /terraform/main
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  # Bootstrap roots and modules run only locally: one grouped pull request per provider across all of them.
  # Verify with a local terraform init and plan per root after merging. Delete this block to stop these updates.
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap/*
      - /terraform/bootstrap/module/*
    groups:
      bootstrap-providers:
        patterns: ["*"]
        group-by: dependency-name
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
