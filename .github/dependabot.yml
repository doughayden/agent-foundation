version: 2
# Cooldown is exclude-newer plus one day: Dependabot counts whole days, so the same number can admit a release up to a day younger
updates:
  # Bumps SHA pins and their version comments; setup-uv's uv input stays put, held to [tool.uv] required-version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
  # One grouped PR per provider across every root and module; a bootstrap lock bump still needs a local init and apply per root
  - package-ecosystem: terraform
    directories:
      - /terraform/main
      - /terraform/bootstrap/*
      - /terraform/bootstrap/module/*
    groups:
      providers:
        patterns: ["*"]
        group-by: dependency-name
    schedule:
      interval: weekly
    cooldown:
      default-days: 6
