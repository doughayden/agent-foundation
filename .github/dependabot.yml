version: 2
# Security updates ignore schedule.interval and open when an advisory is published
# Cooldown is exclude-newer plus one day: Dependabot counts whole days, so the same number can admit a release up to a day younger
updates:
  # Bumps SHA pins and their version comments; setup-uv's uv input stays put, held to [tool.uv] required-version
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 6
  - package-ecosystem: pre-commit
    directory: /
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 6
  # Minor and patch updates share one pull request; each major update gets its own; open security fixes share one.
  # google-adk stays out of both groups, so each ADK version or security bump arrives as its own pull request.
  # The trailing * matches the extras in its dependency names (google-adk[gcp,otel-gcp], google-adk[eval]).
  - package-ecosystem: uv
    directory: /
    groups:
      python-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["google-adk*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: ["google-adk*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 6
  # terraform/main: CI plans the grouped provider bumps on the pull request and applies them to dev on merge
  - package-ecosystem: terraform
    directory: /terraform/main
    groups:
      main-providers:
        patterns: ["*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 6
  # Bootstrap roots and modules run only locally: one grouped pull request per provider across all of them.
  # Verify with a local terraform init and plan per root after merging. Delete this block to stop these updates.
  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap/*
      - /terraform/bootstrap/module/*
    groups:
      bootstrap-providers:
        patterns: ["*"]
        group-by: dependency-name
    schedule:
      interval: monthly
    cooldown:
      default-days: 6
