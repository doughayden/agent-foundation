name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Typical run: <1 min (path filtering). 5 min is generous buffer
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            # Tracks the PyPA src-layout convention: source under src/, tests under tests/
            # https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'

  # Unfiltered: the hooks check every file type, not only the code paths
  code-quality:
    name: Code Quality and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Typical run: 2-3 min (hooks + tests). 10 min prevents hanging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false  # Keep the repo token out of .git/config; pre-commit runs third-party hook code

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # The terraform-fmt hook needs the binary on PATH
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Install dependencies
        id: install
        run: uv sync --all-extras --locked

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # mypy revalidates cached entries, so a fallback restore costs a re-check, not a wrong result
      - name: Restore mypy cache
        id: mypy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', '.python-version') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', '.python-version') }}-
            mypy-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Only main saves: PR runs read main's cache, and a ~400 MB entry per PR run would evict the uv cache
      - name: Save mypy cache
        if: always() && github.event_name == 'push' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .mypy_cache
          key: ${{ steps.mypy-cache.outputs.cache-primary-key }}

      # Runs even when the hooks fail
      - name: Run pytest with coverage
        if: always() && steps.install.outcome == 'success'
        run: uv run pytest --cov

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Typical run: 2-3 min (deps + Postgres lane, incl. image pull). 10 min prevents hanging
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Restore-only: same key as code-quality, which is the sole saver (avoids reserve race)
          save-cache: false

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run integration tests
        run: uv run pytest tests/integration

  # Agent eval using deterministic scoring metrics (no LLM judge)
  agent-eval:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Agent Eval (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Typical run: 2-3 min (sync + two live inference runs): 10 min prevents hanging
    environment: dev
    permissions:
      contents: read
      id-token: write  # WIF auth for Vertex AI inference
    env:
      GOOGLE_GENAI_USE_ENTERPRISE: "TRUE"
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Restore-only: same key as code-quality, which is the sole saver (avoids reserve race)
          save-cache: false

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Run deterministic agent evals
        run: uv run pytest tests/eval -m "deterministic" -s  # -s streams ADK output into the job log

  # Always-runs sentinel for branch protection
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Typical run: <1 min (status check). 5 min is generous buffer
    needs: [changes, code-quality, integration, agent-eval]
    if: always()
    steps:
      - name: Check required status
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "❌ Changes detection failed (result: ${{ needs.changes.result }})"
            exit 1
          fi

          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality and tests failed"
            exit 1
          fi
          echo "✅ Code quality and tests passed"

          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "⏭️ Integration and agent evals skipped - no relevant files changed"
          elif [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "❌ Integration tests failed"
            exit 1
          elif [[ "${{ needs.agent-eval.result }}" != "success" ]]; then
            echo "❌ Agent eval gate failed"
            exit 1
          else
            echo "✅ Integration and agent evals passed"
          fi
