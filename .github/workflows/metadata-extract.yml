name: Metadata Extract

on:
  workflow_call:
    outputs:
      tags:
        description: 'Newline-separated list of Docker image tag names (registry-agnostic)'
        value: ${{ jobs.extract-metadata.outputs.tags }}

permissions:
  contents: read

jobs:
  extract-metadata:
    name: Extract Build Metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.extract.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract metadata
        id: extract
        run: |
          set -euo pipefail

          # Determine tags based on context (deployment uses digest, not tags)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR build - use pr-{number}-{sha} (unique per commit, clearly indicates origin)
            # Use PR head SHA (actual commit) instead of merge commit for traceability
            SHA_SHORT=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            TAGS="pr-${{ github.event.pull_request.number }}-${SHA_SHORT}"
          else
            # The full SHA names the commit's image; an abbreviation can collide with another commit's
            TAGS="$(git rev-parse HEAD)"$'\n'"latest"
            if [ "${{ github.ref_type }}" == "tag" ]; then
              # A promotion tag (<env>-vX.Y.Z) names the release tag it promotes, which must mark the same commit
              VERSION="v${GITHUB_REF_NAME#*-v}"
              if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::Promotion tag ${GITHUB_REF_NAME} does not have the form <env>-vX.Y.Z"
                exit 1
              fi
              if [ "$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::Promotion tag ${GITHUB_REF_NAME} needs release tag ${VERSION} on the same commit"
                exit 1
              fi
              TAGS="${TAGS}"$'\n'"${VERSION}"
              echo "release_tag=${VERSION}" >> "$GITHUB_OUTPUT"
            fi
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Job Summary
        # Ref name is attacker-controlled on fork PRs, so it reaches the shell
        # through the environment rather than through ${{ }} interpolation
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          RELEASE_TAG: ${{ steps.extract.outputs.release_tag }}
        run: |
          set -euo pipefail

          # Use PR head SHA for pull requests, git SHA for other events
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            SHA_SHORT=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          else
            SHA_SHORT=$(git rev-parse HEAD | cut -c1-7)
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 📦 Build Metadata

          | Event | Ref | Commit |
          |-------|-----|--------|
          | \`${{ github.event_name }}\` | \`${REF_NAME}\` | \`${SHA_SHORT}\` |

          EOF

          if [ -n "${RELEASE_TAG}" ]; then
            echo "**Promotes:** \`${REF_NAME}\` → \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### 🏷️ Image Tags" >> "$GITHUB_STEP_SUMMARY"

          # Format tags as bulleted list (tags already newline-separated)
          echo "${{ steps.extract.outputs.tags }}" | grep -v '^$' | while read -r tag; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

          # Add separator
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
